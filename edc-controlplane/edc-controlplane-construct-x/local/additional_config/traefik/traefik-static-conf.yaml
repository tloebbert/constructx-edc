log:
  level: TRACE

providers:
  docker:
    watch: true
    exposedByDefault: false
    network: proxy
  file:
    directory: /etc/traefik/config # path to dynamic config

# Comment out in production!
api:
  insecure: true #dashboard

ping:
  entryPoint: web

entryPoints:
  websecure:
    address: :443
  web:
    address: :80
