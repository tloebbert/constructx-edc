http:
  routers:
    # Identity Hub
    idhub-did:
      entrypoints:
        - web
        - websecure
      rule: PathPrefix(`/`) # && Host(`{{ env "DOMAIN" }}`) Host must not be set, because it will clash with the 'host' header. Should be fine in production
      service: idhub-did-svc
      tls:
    #        certresolver: edc-resolver
    idhub-identity:
      entrypoints:
        - web
        - websecure
      rule: Host(`{{ env "DOMAIN" }}`) && PathPrefix(`/api/identity`)
      service: idhub-identity-svc
      tls:
    #        certresolver: edc-resolver
    idhub-sts:
      entrypoints:
        - web
        - websecure
      rule: Host(`{{ env "DOMAIN" }}`) && PathPrefix(`/api/sts`)
      service: idhub-sts-svc
      tls:
    #        certresolver: edc-resolver
    idhub-credentials:
      entrypoints:
        - web
        - websecure
      rule: Host(`{{ env "DOMAIN" }}`) && PathPrefix(`/api/credentials`)
      service: idhub-credentials-svc
      tls:
    #        certresolver: edc-resolver

    # Control Plane
    ctrl-management:
      entrypoints:
        - web
        - websecure
      rule: Host(`{{ env "DOMAIN" }}`) && PathPrefix(`/management`)
      service: ctrl-management-svc
      tls:
    #        certresolver: edc-resolver
    ctrl-dsp:
      entrypoints:
        - web
        - websecure
      rule: Host(`{{ env "DOMAIN" }}`) && PathPrefix(`/dsp`)
      service: ctrl-dsp-svc
      tls:
    #        certresolver: edc-resolver

    # Data Plane
    data-public:
      entrypoints:
        - web
        - websecure
      rule: Host(`{{ env "DOMAIN" }}`) && PathPrefix(`/public`)
      service: data-public-svc
      tls:
    #        certresolver: edc-resolver

  services:
    idhub-did-svc:
      loadBalancer:
        servers:
          - url: http://provider-idhub
    idhub-identity-svc:
      loadBalancer:
        servers:
          - url: http://provider-idhub:15151
    idhub-sts-svc:
      loadBalancer:
        servers:
          - url: http://provider-idhub:9292
    idhub-credentials-svc:
      loadBalancer:
        servers:
          - url: http://provider-idhub:13131
    ctrl-management-svc:
      loadBalancer:
        servers:
          - url: http://provider-controlplane:9010
    ctrl-dsp-svc:
      loadBalancer:
        servers:
          - url: http://provider-controlplane:9020
    data-public-svc:
      loadBalancer:
        servers:
          - url: http://provider-dataplane:80 # @Fail - Public port should be 9500. Proxy port should work via configuration
