name: con-x-client
services:
  postgres-client:
    container_name: postgres-client
    image: postgres:16.4-alpine
    pull_policy: if_not_present
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    volumes:
      - ./additional_config/pg_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -h 127.0.0.1 || exit 1" ]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - con-x-client-network

  consumer-idhub:
    container_name: consumer-idhub-con-x.psi.de
    image: identityhub-dev:latest
    pull_policy: never
    depends_on:
      postgres-client:
        condition: service_healthy
    ports:
      - "1045:1045"         # debugger
      - "20000:80"          # did API           -> /
      - "20100:15151"       # identity API      -> /api/identity
      - "20500:9292"        # sts API           -> /api/sts
      - "20600:13131"       # credentials API   -> /api/credentials
    #      - "8181:8181"        # default API       -> /api
    #      - "9999:9999"        # statuslist API    -> /statuslist
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:1045
      - edc.hostname=con-x.logproit.de
      - edc.iam.did.web.use.https=false
      - edc.ih.api.superuser.id=admin
      - edc.ih.api.superuser.key=YWRtaW4.adminKey
      - web.http.did.port=80
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://postgres-client:5432/cons_ih_db
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://vault-con-x.psi.de:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/logging.properties:/app/logging.properties
    networks:
      - con-x-client-network
    extra_hosts:
      - "vault-con-x.psi.de:88.99.97.141"
      - "issuer-service-con-x.psi.de:88.99.97.141"

  consumer-controlplane:
    container_name: consumer-controlplane-con-x.psi.de
    image: con-x-controlplane-postgresql-hashicorp-vault:latest
    pull_policy: never
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:5005
      - tx.edc.postgresql.migration.asset.enabled=false
      - tx.edc.postgresql.migration.agreementbpns.enabled=false
      - tx.edc.postgresql.migration.bpn.enabled=false
      - tx.edc.postgresql.migration.contractdefinition.enabled=false
      - tx.edc.postgresql.migration.contractnegotiation.enabled=false
      - tx.edc.postgresql.migration.dataplaneinstance.enabled=false
      - tx.edc.postgresql.migration.edr.enabled=false
      - tx.edc.postgresql.migration.federatedcatalog.enabled=false
      - tx.edc.postgresql.migration.jti-validation.enabled=false
      - tx.edc.postgresql.migration.policy-monitor.enabled=false
      - tx.edc.postgresql.migration.policy.enabled=false
      - tx.edc.postgresql.migration.transferprocess.enabled=false
      - edc.iam.trusted-issuer.example.id=did:web:issuer-service-con-x.psi.de%3A10000:con-x-issuer
      - edc.iam.did.web.use.https=false
      - edc.iam.sts.oauth.client.secret.alias=consumersecret
      - edc.iam.credential.revocation.mimetype=application/json
      - edc.iam.sts.oauth.token.url=http://con-x.logproit.de:20500/api/sts/token
      - edc.iam.sts.oauth.client.id=did:web:con-x.logproit.de%3A20000:user:consumer
      - edc.iam.issuer.id=did:web:con-x.logproit.de%3A20000:user:consumer
      - web.http.port=9000
      - web.http.path=/api
      - web.http.management.port=9010
      - web.http.management.path=/management
      - web.http.protocol.port=9020
      - web.http.protocol.path=/dsp
      - web.http.validation.port=9030
      - web.http.validation.path=/validation
      - web.http.control.port=9050
      - web.http.control.path=/control
      - edc.hostname=con-x.logproit.de
      - edc.participant.id=did:web:con-x.logproit.de%3A20000:user:consumer
      - edc.dsp.callback.address=http://con-x.logproit.de:29020/dsp
      - edc.sql.schema.autocreate=true
      - edc.datasource.default.url=jdbc:postgresql://postgres-client:5432/cons_cpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.vault.hashicorp.url=http://vault-con-x.psi.de:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
    volumes:
      - ./additional_config/logging.properties:/app/dataspaceconnector-configuration.properties
    depends_on:
      postgres-client:
        condition: service_healthy
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "5005:5005"   # Debugger
      - "29000:9000"  # Default port
      - "29010:9010"  # Management API
      - "29020:9020" # DSP API
      - "29050:9050" # Control API - Custom Added
    networks:
      - con-x-client-network
    extra_hosts:
      - "vault-con-x.psi.de:88.99.97.141"
      - "issuer-service-con-x.psi.de:88.99.97.141"

  consumer-dataplane:
    container_name: consumer-dataplane-con-x.psi.de
    image: con-x-dataplane-postgresql-hashicorp-vault:latest
    pull_policy: never
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:5005
      - web.http.public.port=9600
      - web.http.public.path=/public
      - web.http.management.port=9610
      - web.http.management.path=/management
      - web.http.control.port=9650
      - web.http.control.path=/control
      - edc.hostname=con-x.logproit.de
      - edc.dpf.selector.url=http://con-x.logproit.de:29050/control/v1/dataplanes
      - edc.data.plane.self.unregistration=true
      - edc.datasource.default.url=jdbc:postgresql://postgres-client:5432/cons_dpl
      - edc.datasource.default.user=admin
      - edc.datasource.default.password=password
      - edc.sql.schema.autocreate=true
      - edc.transfer.proxy.token.signer.privatekey.alias=cons_priv
      - edc.transfer.proxy.token.verifier.publickey.alias=cons_pub
      - edc.vault.hashicorp.url=http://vault-con-x.psi.de:8200
      - edc.vault.hashicorp.health.check.enabled=true
      - edc.vault.hashicorp.token=vaultsecret0123456789
      - edc.iam.trusted-issuer.example.id=did:web:issuer-service-con-x.psi.de%3A10000:con-x-issuer
      - edc.iam.did.web.use.https=false
      - edc.iam.sts.oauth.client.secret.alias=consumersecret
      - edc.iam.credential.revocation.mimetype=application/json
      - edc.iam.sts.oauth.token.url=http://con-x.logproit.de:20500/api/sts/token
      - edc.iam.sts.oauth.client.id=did:web:con-x.logproit.de%3A20000:user:consumer
      - edc.iam.issuer.id=did:web:con-x.logproit.de%3A20000:user:consumer
    depends_on:
      postgres-client:
        condition: service_healthy
    entrypoint: [ "java", "-jar", "edc-runtime.jar", "--log-level=DEBUG" ]
    ports:
      - "5008:5005"   # Debugger
      - "9600:9600" # Public API
      - "9610:9610" # Management API
      - "9650:9650" # Control API
    networks:
      - con-x-client-network
    extra_hosts:
      - "vault-con-x.psi.de:88.99.97.141"
      - "issuer-service-con-x.psi.de:88.99.97.141"

networks:
  con-x-client-network:
    name: con-x-client-network
    driver: bridge
